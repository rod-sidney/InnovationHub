<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de iniciativas - Innovation Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/main.css" rel="stylesheet">
    <link href="../css/catalogo-de-iniciativas.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm" aria-label="Principal">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">Innovation Hub</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="catalogo-de-iniciativas.html">Catálogo de
                                iniciativas</a></li>
                        <li class="nav-item"><a class="nav-link" href="registro-de-iniciativa.html">Publicar
                                iniciativa</a></li>
                        <li class="nav-item"><a class="nav-link" href="perfil-de-usuario.html">Mi perfil</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h1 class="mb-4 fw-bold text-dark">Catálogo de iniciativas</h1>

        <aside class="card shadow-sm border-0 mb-5 p-4" aria-labelledby="titulo-filtros">
            <h2 id="titulo-filtros" class="h5 mb-3 fw-bold text-primary">Filtrar iniciativas</h2>

            <form id="form-filtros" class="row g-3 align-items-end">
                <div class="col-12 col-md-3">
                    <label for="filtro-tipo" class="form-label fw-semibold">Tipo</label>
                    <select id="filtro-tipo" name="tipo" class="form-select">
                        <option value="">Todos</option>
                        <option value="idea">Idea</option>
                        <option value="necesidad">Necesidad</option>
                        <option value="reto">Reto</option>
                    </select>
                </div>

                <div class="col-12 col-md-3">
                    <label for="filtro-categoria" class="form-label fw-semibold">Categoría</label>
                    <select id="filtro-categoria" name="categoria" class="form-select">
                        <option value="">Todas</option>
                        <option value="educacion">Educación</option>
                        <option value="ambiente">Ambiente</option>
                        <option value="comunidad">Comunidad</option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label for="filtro-competencia" class="form-label fw-semibold">Palabra clave o Competencia</label>
                    <input type="text" id="filtro-competencia" name="competencia" class="form-control"
                        placeholder="Ej. React, IoT, Python...">
                </div>

                <div class="col-12 col-md-2">
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Aplicar filtros</button>
                </div>
            </form>
        </aside>

        <section aria-labelledby="titulo-resultados">
            <h2 id="titulo-resultados" class="h4 mb-4 fw-bold text-dark">Cargando...</h2>
            <!-- JS inyecta las tarjetas -->
            <div class="row g-4" id="catalogo-contenedor"></div>
        </section>
    </main>

    <footer class="bg-dark text-light py-4 text-center mt-auto">
        <div class="container">
            <p class="mb-1">Innovation Hub · Universidad CENFOTEC</p>
            <a href="mailto:innovationhub@ucenfotec.ac.cr"
                class="text-secondary text-decoration-none">innovationhub@ucenfotec.ac.cr</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>

</html>
