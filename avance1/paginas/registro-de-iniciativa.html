<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicar iniciativa - Innovation Hub</title>
    <link href="../css/main.css" rel="stylesheet">
    <script src="../js/main.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm" aria-label="Principal">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">Innovation Hub</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="catalogo-de-iniciativas.html">Catálogo de
                                iniciativas</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page"
                                href="registro-de-iniciativa.html">Publicar iniciativa</a></li>
                        <li class="nav-item"><a class="nav-link" href="perfil-de-usuario.html">Mi perfil</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="text-center mb-4">
                    <h1 class="fw-bold text-dark">Publicar iniciativa</h1>
                    <p class="text-muted">Comparte tu idea, necesidad o reto con la comunidad para formar un equipo.</p>
                </div>

                <div class="card bg-secondary bg-opacity-55 shadow-sm border-0 p-4 p-md-5">
                    <form id="form-registro-iniciativa" action="#" method="POST">

                        <fieldset class="mb-5">
                            <legend class="h5 fw-bold text-primary border-bottom pb-2 mb-4">Información Básica</legend>

                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-semibold">Título de la iniciativa <span
                                        class="text-danger" aria-hidden="true">*</span></label>
                                <input type="text" id="titulo" name="titulo" class="form-control" required
                                    aria-required="true">
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6 mb-3">
                                    <label for="tipo" class="form-label fw-semibold">Tipo de iniciativa <span
                                            class="text-danger" aria-hidden="true">*</span></label>
                                    <select id="tipo" name="tipo" class="form-select" required aria-required="true">
                                        <option value="">Seleccione una opción</option>
                                        <option value="Idea">Idea</option>
                                        <option value="Necesidad">Necesidad</option>
                                        <option value="Reto">Reto</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="categoria" class="form-label fw-semibold">Categoría <span
                                            class="text-danger" aria-hidden="true">*</span></label>
                                    <select id="categoria" name="categoria" class="form-select" required
                                        aria-required="true">
                                        <option value="">Seleccione una opción</option>
                                        <option value="Educación">Educación</option>
                                        <option value="Ambiente">Ambiente</option>
                                        <option value="Comunidad">Comunidad</option>
                                    </select>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="mb-5">
                            <legend class="h5 fw-bold text-primary border-bottom pb-2 mb-4">Detalles del Proyecto
                            </legend>

                            <div class="mb-3">
                                <label for="resumen" class="form-label fw-semibold">Resumen (Breve descripción) <span
                                        class="text-danger" aria-hidden="true">*</span></label>
                                <textarea id="resumen" name="resumen" class="form-control" rows="3" required
                                    aria-required="true"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label fw-semibold">Descripción completa <span
                                        class="text-danger" aria-hidden="true">*</span></label>
                                <textarea id="descripcion" name="descripcion" class="form-control" rows="6" required
                                    aria-required="true"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="problema" class="form-label fw-semibold">Problema identificado</label>
                                <textarea id="problema" name="problema" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6 mb-3">
                                    <label for="beneficiarios" class="form-label fw-semibold">Beneficiarios</label>
                                    <input type="text" id="beneficiarios" name="beneficiarios" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="etiquetas" class="form-label fw-semibold">Etiquetas</label>
                                    <input type="text" id="etiquetas" name="etiquetas" class="form-control"
                                        placeholder="Ej: IoT, Sostenibilidad, UX">
                                    <div class="form-text">Separadas por comas.</div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="mb-5">
                            <legend class="h5 fw-bold text-primary border-bottom pb-2 mb-4">Equipo y Privacidad</legend>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6 mb-3">
                                    <label for="participantes" class="form-label fw-semibold">Participantes
                                        estimados</label>
                                    <input type="number" id="participantes" name="participantes" class="form-control"
                                        min="1" max="20">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="visibilidad" class="form-label fw-semibold">Nivel de visibilidad <span
                                            class="text-danger" aria-hidden="true">*</span></label>
                                    <select id="visibilidad" name="visibilidad" class="form-select" required
                                        aria-required="true">
                                        <option value="Pública">Pública</option>
                                        <option value="Institucional">Institucional</option>
                                        <option value="Restringida">Restringida</option>
                                        <option value="Privada">Privada</option>
                                    </select>
                                </div>
                            </div>

                            <div id="contenedor-competencias">
                                <label class="form-label fw-semibold">Competencias necesarias</label>
                                <div class="input-group mb-2">
                                    <input type="text" id="competencia-1" name="competencias[]" class="form-control"
                                        placeholder="Ej: Programación en Python">
                                </div>
                            </div>
                            <button type="button" id="btn-agregar-competencia"
                                class="btn btn-outline-secondary btn-sm mt-2">+ Añadir otra competencia</button>
                        </fieldset>

                        <div class="d-grid mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">Publicar iniciativa</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 text-center mt-auto">
        <div class="container">
            <p class="mb-1">Innovation Hub · Universidad CENFOTEC</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
