<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitud de participación - Innovation Hub</title>
    <link href="../css/main.css" rel="stylesheet">
    <script src="../js/main.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm" aria-label="Principal">
            <div class="container">
                <a class="navbar-brand fw-bold" href="../index.html">Innovation Hub</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="catalogo-de-iniciativas.html">Catálogo de
                                iniciativas</a></li>
                        <li class="nav-item"><a class="nav-link" href="registro-de-iniciativa.html">Publicar
                                iniciativa</a></li>
                        <li class="nav-item"><a class="nav-link" href="perfil-de-usuario.html">Mi perfil</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-6">

                <div class="mb-4">
                    <a href="detalle-de-iniciativa.html" class="btn btn-outline-primary btn-sm shadow-sm">
                        &larr; Volver
                    </a>
                </div>

                <div class="card shadow-sm border-0 bg-secondary bg-opacity-55">
                    <div class="card-header bg-transparent border-0 py-4 pb-0">
                        <h1 class="h4 fw-bold mb-1 text-primary">Solicitud de participación</h1>
                        <p class="mb-0 small text-primary">Postulando para: <strong>Mapa interactivo de espacios de
                                estudio colaborativo</strong></p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <form id="form-solicitud" action="#" method="POST">

                            <div class="mb-3">
                                <label for="rol" class="form-label fw-semibold">Rol deseado <span
                                        class="text-danger">*</span></label>
                                <input type="text" id="rol" name="rol" class="form-control"
                                    placeholder="Ej: Desarrollador Frontend, Diseñador UX" required>
                            </div>

                            <div class="mb-3">
                                <label for="competencia" class="form-label fw-semibold">Competencia principal que
                                    aportas <span class="text-danger">*</span></label>
                                <input type="text" id="competencia" name="competencia" class="form-control"
                                    placeholder="Ej: React y Geolocalización" required>
                            </div>

                            <div class="mb-4">
                                <label for="disponibilidad" class="form-label fw-semibold">Disponibilidad de tiempo
                                    <span class="text-danger">*</span></label>
                                <select id="disponibilidad" name="disponibilidad" class="form-select" required>
                                    <option value="">Seleccione su disponibilidad</option>
                                    <option value="5_horas">Menos de 5 horas semanales</option>
                                    <option value="10_horas">5 a 10 horas semanales</option>
                                    <option value="mas_10_horas">Más de 10 horas semanales</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje de presentación <span
                                        class="text-danger">*</span></label>
                                <textarea id="mensaje" name="mensaje" class="form-control" rows="5"
                                    placeholder="Cuéntale al propietario por qué te interesa este proyecto..."
                                    required></textarea>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                                <a href="detalle-de-iniciativa.html"
                                    class="btn btn-link text-decoration-none text-muted px-0">Cancelar</a>
                                <button type="submit" class="btn btn-primary fw-bold px-4">Enviar solicitud</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 text-center mt-auto">
        <div class="container">
            <p class="mb-1">Innovation Hub · Universidad CENFOTEC</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
